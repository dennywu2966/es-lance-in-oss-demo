<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1180" viewBox="0 0 560 1180">
  <defs>
    <linearGradient id="bgm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3f7ff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <style>
      .title { font: 700 20px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .h2 { font: 700 16px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #1e293b; }
      .t { font: 600 12px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .chip { font: 700 11px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="560" height="1180" fill="url(#bgm)"/>
  <rect x="20" y="20" width="520" height="72" rx="14" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="44" y="63" class="title">核心能力演示台</text>

  <rect x="20" y="104" width="520" height="66" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="40" y="132" class="t">数据集: real-87k-dims-768</text>
  <rect x="372" y="120" width="148" height="30" rx="8" fill="#dbeafe"/>
  <text x="420" y="140" class="chip">场景预设 ▼</text>

  <rect x="20" y="184" width="520" height="178" rx="12" fill="#ffffff" stroke="#cfe0ff"/>
  <text x="40" y="214" class="h2">多分片配置</text>
  <text x="40" y="244" class="t">分片数: 1 | 2 | 4 | 8</text>
  <text x="40" y="268" class="t">路由策略: ES_ROUTING</text>
  <text x="40" y="292" class="t">shard_path: {index}/shard-{id}</text>
  <rect x="40" y="312" width="180" height="32" rx="8" fill="#2563eb"/>
  <text x="68" y="333" style="font:700 12px sans-serif; fill:#fff;">重建并切换索引</text>

  <rect x="20" y="376" width="520" height="156" rx="12" fill="#ffffff" stroke="#cfe0ff"/>
  <text x="40" y="406" class="h2">NRT 配置</text>
  <text x="40" y="434" class="t">自动刷新: ON    间隔: 30s</text>
  <rect x="40" y="450" width="170" height="32" rx="8" fill="#0ea5e9"/>
  <text x="62" y="471" style="font:700 12px sans-serif; fill:#fff;">手动刷新 Lance</text>
  <text x="40" y="504" class="t">最近刷新: 16:22:31 | GREEN</text>

  <rect x="20" y="546" width="520" height="176" rx="12" fill="#ffffff" stroke="#cfe0ff"/>
  <text x="40" y="576" class="h2">Prefilter 配置</text>
  <text x="40" y="604" class="t">启用过滤: 是</text>
  <text x="40" y="628" class="t">字段: category    值: electronics</text>
  <text x="40" y="652" class="t">nprobes: 20</text>
  <text x="40" y="684" class="t">策略: AUTO  |  状态: SQL 下推成功</text>

  <rect x="20" y="736" width="520" height="124" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="40" y="766" class="h2">搜索工作台</text>
  <text x="40" y="792" class="t">模式: kNN  Top-K: 5  Profiling: 开</text>
  <rect x="40" y="808" width="410" height="32" rx="8" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="54" y="828" class="t">machine learning retrieval...</text>

  <rect x="20" y="874" width="520" height="146" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="40" y="904" class="h2">结果与证据</text>
  <text x="40" y="930" class="t">#1 doc_123  score: 0.9123</text>
  <rect x="40" y="944" width="160" height="22" rx="11" fill="#dcfce7"/>
  <text x="54" y="959" class="chip">shard=2/4</text>
  <rect x="208" y="944" width="182" height="22" rx="11" fill="#dbeafe"/>
  <text x="224" y="959" class="chip">prefilter=APPLIED</text>
  <rect x="398" y="944" width="112" height="22" rx="11" fill="#fef3c7"/>
  <text x="414" y="959" class="chip">NRT OK</text>

  <rect x="20" y="1034" width="520" height="126" rx="12" fill="#0f172a"/>
  <text x="40" y="1064" style="font:700 16px sans-serif; fill:#f8fafc;">ES 请求 JSON</text>
  <text x="40" y="1090" style="font:500 11px monospace; fill:#e2e8f0;">{"filter":[{"term":{"category":"electronics"}}],</text>
  <text x="40" y="1112" style="font:500 11px monospace; fill:#e2e8f0;">"ext":{"lance":{"nprobes":20}}}</text>
</svg>
