<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#e8eef9"/>
    </linearGradient>
    <style>
      .title { font: 700 24px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .h2 { font: 700 18px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #1e293b; }
      .label { font: 600 13px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #334155; }
      .text { font: 500 12px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .chip { font: 700 11px 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="url(#bg)"/>

  <rect x="24" y="20" width="1352" height="58" rx="10" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="44" y="56" class="title">核心能力演示台  Demo Console</text>
  <rect x="1040" y="34" width="154" height="30" rx="8" fill="#dbeafe"/>
  <text x="1070" y="54" class="label">场景预设 ▼</text>
  <rect x="1208" y="34" width="148" height="30" rx="8" fill="#f1f5f9"/>
  <text x="1242" y="54" class="label">重置配置</text>

  <rect x="24" y="92" width="1352" height="52" rx="10" fill="#ffffff" stroke="#dbe4f0"/>
