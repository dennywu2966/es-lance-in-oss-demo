  <rect x="1128" y="106" width="230" height="26" rx="13" fill="#dcfce7"/>
  <text x="1156" y="123" class="chip">状态: 已就绪 (GREEN)</text>

  <rect x="24" y="160" width="436" height="220" rx="12" fill="#ffffff" stroke="#cfe0ff"/>
