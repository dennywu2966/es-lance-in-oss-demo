  <text x="44" y="258" class="label">路由策略</text>
  <rect x="118" y="242" width="212" height="28" rx="7" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="132" y="261" class="text">ES_ROUTING ▼</text>
  <text x="44" y="296" class="label">shard_path</text>
  <rect x="132" y="280" width="286" height="28" rx="7" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="146" y="299" class="text">{index}/shard-{id}</text>
  <rect x="44" y="324" width="170" height="34" rx="8" fill="#2563eb"/>
  <text x="74" y="346" style="font:700 13px sans-serif; fill:#fff;">重建并切换索引</text>
  <text x="232" y="346" class="text">当前: shards=4</text>

  <rect x="482" y="160" width="436" height="220" rx="12" fill="#ffffff" stroke="#cfe0ff"/>
