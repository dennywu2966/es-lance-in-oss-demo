  <text x="1148" y="258" class="label">值</text>
  <rect x="1178" y="242" width="180" height="28" rx="7" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="1192" y="261" class="text">electronics</text>
  <text x="960" y="296" class="label">nprobes</text>
  <rect x="1018" y="280" width="82" height="28" rx="7" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="1048" y="299" class="text">20</text>
  <text x="960" y="340" class="text">策略: AUTO (按匹配规模自动选择)</text>
  <text x="960" y="360" class="text">状态: SQL下推成功</text>

  <rect x="24" y="396" width="1352" height="116" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="44" y="426" class="h2">搜索工作台</text>
  <rect x="44" y="442" width="88" height="30" rx="8" fill="#2563eb"/>
  <text x="76" y="462" style="font:700 12px sans-serif; fill:#fff;">kNN</text>
  <rect x="140" y="442" width="88" height="30" rx="8" fill="#e2e8f0"/>
  <text x="166" y="462" class="chip">Hybrid</text>
  <text x="246" y="461" class="label">Top-K</text>
  <rect x="292" y="442" width="70" height="30" rx="7" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="322" y="462" class="text">5</text>
  <text x="380" y="461" class="label">Query</text>
  <rect x="426" y="442" width="664" height="30" rx="7" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="440" y="462" class="text">machine learning retrieval optimization...</text>
  <rect x="1110" y="442" width="148" height="30" rx="8" fill="#1d4ed8"/>
  <text x="1150" y="462" style="font:700 12px sans-serif; fill:#fff;">执行搜索</text>

  <rect x="24" y="528" width="870" height="368" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="44" y="558" class="h2">结果区</text>
  <rect x="44" y="574" width="830" height="90" rx="10" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="62" y="600" class="label">#1 doc_123   score: 0.9123   match: HYBRID</text>
  <rect x="62" y="612" width="180" height="22" rx="11" fill="#dcfce7"/>
  <text x="78" y="627" class="chip">分片证据 shard=2/4</text>
  <rect x="252" y="612" width="248" height="22" rx="11" fill="#dbeafe"/>
  <text x="270" y="627" class="chip">过滤证据 SQL: category='electronics'</text>
  <rect x="510" y="612" width="190" height="22" rx="11" fill="#fef3c7"/>
  <text x="530" y="627" class="chip">NRT: 刷新于 16:22:31</text>
  <text x="62" y="650" class="text">摘要: 该文档说明了向量召回与过滤协同路径...</text>

  <rect x="916" y="528" width="460" height="174" rx="12" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="936" y="558" class="h2">性能与统计</text>
  <text x="936" y="586" class="text">P50: 34ms   P95: 61ms   回退率: 1.2%</text>
  <polyline points="936,654 980,632 1024,640 1068,610 1112,624 1156,604 1200,616 1244,598 1288,608"
            fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <line x1="936" y1="666" x2="1336" y2="666" stroke="#cbd5e1"/>

  <rect x="916" y="722" width="460" height="174" rx="12" fill="#0f172a"/>
  <text x="936" y="752" style="font:700 17px sans-serif; fill:#f8fafc;">ES 请求 JSON</text>
  <text x="936" y="782" style="font:500 12px monospace; fill:#e2e8f0;">{"query":{"bool":{"filter":[{"term":{"category":"electronics"}}]}}</text>
  <text x="936" y="804" style="font:500 12px monospace; fill:#e2e8f0;">"knn":{"field":"vector","k":5,"num_candidates":200}}</text>
  <text x="936" y="826" style="font:500 12px monospace; fill:#e2e8f0;">"ext":{"lance":{"nprobes":20,"prefilter":"AUTO"}}}</text>
